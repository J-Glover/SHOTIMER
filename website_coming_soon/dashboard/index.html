<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to Shotimer Rooms Dashboard...</title>
  <meta http-equiv="refresh" content="0; url=/app/?view=dashboard">
  <script>
    const search = window.location.search || '?view=dashboard';
    const hash = window.location.hash || '';
    const target = '/app/' + (search.includes('view=') ? search : (search ? search + '&view=dashboard' : '?view=dashboard')) + hash;
    window.location.replace(target);
  </script>
</head>
<body style="font-family: sans-serif; background: #07090E; color: #F1F5F9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p>Loading Shotimer Rooms Dashboard... <a href="/app/?view=dashboard" style="color: #F59E0B;">Click here if not redirected</a>.</p>
</body>
</html>
