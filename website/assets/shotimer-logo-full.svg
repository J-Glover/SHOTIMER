<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 80" width="100%" height="100%" fill="none">
  <!-- Stopwatch Vector Icon -->
  <g transform="translate(10, 16) scale(2)">
    <line x1="10" y1="2" x2="14" y2="2" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"></line>
    <path d="M5 3L2 6" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"></path>
    <path d="M22 6L19 3" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"></path>
    <circle cx="12" cy="13" r="8" stroke="#F59E0B" stroke-width="2.2"></circle>
    <line x1="12" y1="9" x2="12" y2="13" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"></line>
  </g>

  <!-- Typography: Sho (White) + timer (Amber) -->
  <text x="75" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, sans-serif" font-size="36" font-weight="800" fill="#FAF8F5" letter-spacing="-0.03em">Sho<tspan fill="#F59E0B">timer</tspan></text>

  <!-- Badge Pill -->
  <rect x="250" y="27" width="135" height="26" rx="13" fill="#18181B" stroke="#27272A" stroke-width="1.5"></rect>
  <circle cx="266" cy="40" r="4" fill="#10B981"></circle>
  <text x="278" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, sans-serif" font-size="11" font-weight="700" fill="#A1A1AA" letter-spacing="0.06em">COMING SOON</text>
</svg>
